CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_ANIMATION=y
CONFIG_ZMK_ANIMATION_MOCK_LED_STRIP=y
CONFIG_ZMK_ANIMATION_FPS=10

# Deliberately asymmetric so a freshly-pressed slot's remaining
# (MIN_DURATION_MS) is much larger than an already-extended, continuously
# held slot's remaining (EXTEND_MS_ON_HOLD): this is the shape that exposes
# the animation_stop_work_handler bug in animation_trigger.c, where the code
# used to reschedule the *next* handler run based on the MAXIMUM remaining
# duration across active slots instead of the MINIMUM. See native_sim.keymap
# for the exact timeline this produces.
CONFIG_ZMK_ANIMATION_TRIGGER_MIN_DURATION_MS=5000
CONFIG_ZMK_ANIMATION_TRIGGER_MAX_DURATION_MS=60000
CONFIG_ZMK_ANIMATION_TRIGGER_EXTEND_MS_ON_HOLD=200
