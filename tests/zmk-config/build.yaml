include:
  - artifact: animation_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: animation_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_ANIMATION=y -DCONFIG_ZMK_ANIMATION_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: animation_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_ANIMATION=y

  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_ANIMATION=y -DCONFIG_ZMK_ANIMATION_STUDIO_RPC=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: animation_tester_xiao_shield
    board: xiao_ble//zmk
    shield: tester_xiao_animation

  - artifact: animation_tester_xiao_shield_with_custom_settings
    board: xiao_ble//zmk
    shield: tester_xiao_animation
    cmake-args: -DCONFIG_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_ANIMATION_CUSTOM_SETTINGS=y
