CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_ANIMATION=y
CONFIG_ZMK_ANIMATION_MOCK_LED_STRIP=y
CONFIG_ZMK_ANIMATION_FPS=10

# Split-peripheral role (CONFIG_ZMK_SPLIT_ROLE_CENTRAL unset = n, matching
# tests/split_peripheral in the sibling zmk-driver-pmw3610-with-custom-
# studio-rpc module): exercises animations/layer_status.c's
# IS_SPLIT_PERIPHERAL path (refresh_layer_status_peripheral /
# zmk_animation_layer_status_set_status) and the animls behavior's
# peripheral-side receiver (src/behaviors/animation_layer_status.c), neither
# of which had any test coverage before this (BUG 6 in the Phase B code
# review - no test in tests/ set CONFIG_ZMK_SPLIT at all).
#
# native_sim cannot simulate the real BLE split transport end-to-end, so
# this does not relay a status update *from* a separate central build; it
# builds a single peripheral-role firmware and (via
# CONFIG_ZMK_ANIMATION_LAYER_STATUS_SPLIT_TEST's boot-time self-test, see
# src/split_test/layer_status_split_test.c) invokes the `animls` behavior's
# binding directly - the exact call ZMK's split relay makes on a real
# peripheral - to exercise the actual behavior-invocation path -
# on_keymap_binding_pressed/released -> zmk_animation_layer_status_set_status()
# -> refresh_layer_status_peripheral() -> render_frame - end to end.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_ANIMATION_LAYER_STATUS_SPLIT_TEST=y
