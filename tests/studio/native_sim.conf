CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_ANIMATION=y
CONFIG_ZMK_ANIMATION_MOCK_LED_STRIP=y
CONFIG_ZMK_ANIMATION_STUDIO_RPC=y
CONFIG_ZMK_ANIMATION_STUDIO_RPC_TEST=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
# Sized against the worst-case GetInfoResponse (every list filled to its
# .options max_count:6 with max_size:24 names), measured by
# src/test/animation_studio_test.c's log_get_info_worst_case_encoded_size()
# and asserted via keycode_events.snapshot - see that file for the exact
# byte count. Value below includes RPC framing margin (skills/zmk-module-dev
# SKILL.md's documented buffer-sizing pitfall).
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=640
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_PRINT_LIST_ON_START=y
